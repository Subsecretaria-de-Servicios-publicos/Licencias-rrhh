{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <div>
    <h2>Cambiar contraseña</h2>
    <p>Usuario: {{ item.full_name }} — {{ item.email }}</p>
  </div>

  <div class="header-actions">
    <a href="/admin/users" class="btn-secondary">Volver</a>
  </div>
</section>

{% if error %}
  <section class="alert-error">
    {{ error }}
  </section>
{% endif %}

<form method="post" action="/admin/users/{{ item.id }}/password" class="form-card password-card">
  <section class="form-section">
    <h3>Nueva contraseña</h3>

    <div class="form-grid">
      <label>
        Contraseña
        <input type="password" name="password" minlength="8" required>
      </label>

      <label>
        Repetir contraseña
        <input type="password" name="password_confirm" minlength="8" required>
      </label>
    </div>

    <p class="muted mt-12">
      La contraseña debe tener al menos 8 caracteres.
    </p>
  </section>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Guardar contraseña</button>
    <a href="/admin/users" class="btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
