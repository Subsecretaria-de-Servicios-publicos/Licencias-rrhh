<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ingresar | RRHH Licencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card">
      <div class="login-brand">
        <div class="brand-icon">RR</div>
        <div>
          <h1>RRHH Licencias</h1>
          <p>Panel interno</p>
        </div>
      </div>

      <h2>Ingresar al sistema</h2>
      <p class="login-subtitle">Usá tu usuario de RRHH para acceder al panel.</p>

      {% if error %}
        <div class="login-error">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/login" class="login-form">
        <label>
          Email
          <input type="email" name="email" placeholder="admin@rrhh.local" required autofocus>
        </label>

        <label>
          Contraseña
          <input type="password" name="password" placeholder="Tu contraseña" required>
        </label>

        <button type="submit" class="btn-primary login-button">
          Ingresar
        </button>
      </form>
    </section>
  </main>
</body>
</html>
